<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <link rel="stylesheet" href="./styles.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DBC Viewer</title>
  <script src="/main.js" defer></script>
</head>

<body data-page="search">
  <div class="app-shell">
    <header class="app-topbar">
      <div>
        <h1>DBC Viewer</h1>
        <div class="app-subtitle">CAN database inspection workspace</div>
      </div>
      <div class="app-actions">
        <input type="file" id="file-input" hidden accept=".dbc,*">
        <button type="button" class="btn btn-primary" onclick="triggerFileUpload()">Open DBC</button>
        <div id="filename" class="file-status" role="status">No DBC loaded</div>
        <button id="warning-toggle" type="button" class="btn btn-outline-warning btn-sm d-none"
          data-bs-toggle="collapse" data-bs-target="#warning-panel" aria-expanded="false"
          aria-controls="warning-panel">
          Warnings <span id="warning-count" class="badge bg-warning text-dark">0</span>
        </button>
      </div>
    </header>

    <nav class="app-nav" aria-label="Main navigation">
      <a class="active" href="/index.html">Search</a>
      <a href="/messages.html">Messages</a>
      <a href="/signals.html">Signals</a>
    </nav>

    <section id="warning-panel" class="collapse warning-panel"></section>

    <main class="row g-3 app-workspace">
      <section class="col-12 col-xl-5">
        <div class="tool-panel">
          <div class="panel-header">
            <div>
              <h2>Search</h2>
              <div class="panel-caption">Find messages and signals by name or ID.</div>
            </div>
          </div>

          <div class="search-controls">
            <input id="signal-input" class="form-control" name="query" placeholder="Search names, CAN IDs, signal IDs..." />
            <div class="btn-group w-100" role="group" aria-label="Search result type">
              <input type="radio" class="btn-check" name="search-kind" id="search-kind-all" value="all" checked>
              <label class="btn btn-outline-secondary" for="search-kind-all">All</label>
              <input type="radio" class="btn-check" name="search-kind" id="search-kind-message" value="message">
              <label class="btn btn-outline-secondary" for="search-kind-message">Messages</label>
              <input type="radio" class="btn-check" name="search-kind" id="search-kind-signal" value="signal">
              <label class="btn btn-outline-secondary" for="search-kind-signal">Signals</label>
            </div>
          </div>

          <div class="result-toolbar">
            <span id="search-count" class="text-muted">0 results</span>
            <div class="btn-group">
              <button id="prevBtn" type="button" class="btn btn-outline-secondary btn-sm">Prev</button>
              <button id="nextBtn" type="button" class="btn btn-outline-secondary btn-sm">Next</button>
            </div>
          </div>
          <div id="results" class="result-list"></div>
        </div>
      </section>

      <aside class="col-12 col-xl-7">
        <div class="tool-panel inspector-panel">
          <div class="panel-header">
            <div>
              <h2>Inspector</h2>
              <div class="panel-caption">Open a result to inspect its decoded fields.</div>
            </div>
            <div class="btn-group">
              <button id="prevHist" type="button" class="btn btn-outline-secondary btn-sm" onclick="prevHist()" disabled>&laquo;</button>
              <button id="nextHist" type="button" class="btn btn-outline-secondary btn-sm" onclick="nextHist()" disabled>&raquo;</button>
            </div>
          </div>
          <div id="signal_card" class="inspector-body"></div>
        </div>
      </aside>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
    crossorigin="anonymous"></script>
</body>

</html>
